# TPM and plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'

# Store tmux-logging output under ~/.tmux/logs.
set -g @logging-path "$HOME/.tmux/logs"

# Use Alt-b as the prefix.
unbind C-b
set-option -g prefix M-b
bind-key M-b send-prefix

# Mouse support, vi keys in copy mode, and responsive key handling.
set -g mouse on
setw -g mode-keys vi
set-option -sg escape-time 10
set-option -g focus-events on

# Wayland Copy-Paste (uncomment these lines)
# set -s set-clipboard off
# set -s copy-command 'wl-copy'
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel
# bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
# bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Advertise RGB support (terminal-overrides also works with older Ubuntu tmux).
set -as terminal-overrides ',*:Tc'

# Send pane navigation keys to Vim/Neovim; otherwise move between tmux panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

# Match the nvim-tmux-navigation Alt-Space binding for next window.
bind-key -n 'M-Space' if-shell "$is_vim" 'send-keys M-Space' 'select-pane -t:.+'

# Keep the same navigation available from vi copy mode.
bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R
bind-key -T copy-mode-vi 'M-Space' select-pane -t:.+

# Start TPM (keep this at the end of the file).
run '~/.tmux/plugins/tpm/tpm'
